<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Sabi">
  <rect width="32" height="32" rx="6" fill="#0A1230"/>
  <!-- One adire motif: concentric rings, resisted out of the indigo, with the
       innermost ring in saffron because that is the colour of evidence. -->
  <g fill="none" stroke="#F7F3EA" stroke-width="1.6">
    <circle cx="16" cy="16" r="10.5"/>
    <circle cx="16" cy="16" r="6.5"/>
  </g>
  <circle cx="16" cy="16" r="2.75" fill="#E5A72C"/>
</svg>
