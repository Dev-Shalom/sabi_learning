# Subject codes — FROZEN CONTRACT (master prompt v2 §10.2)
#
# One file so that two subjects cannot collide on a code, because a collision
# means two different subjects citing the same locator and a student following
# a citation into the wrong syllabus.
#
# The code is 2-3 uppercase letters and appears in every locator for that
# subject (docs/LOCATORS.md): `BIO A1` for a syllabus section, `BIOX 4` for a
# worked example.
#
# ---------------------------------------------------------------------------
# STATUS: DRAFTED, NOT YET VERIFIED.
#
# This list is drafted from general knowledge of the Nigerian senior-secondary
# curriculum. It has NOT been checked against WAEC's, NECO's, NABTEB's or
# JAMB's published subject lists. Before Phase 4 authors content for any
# subject here, that subject's row must be confirmed against the exam body's
# own syllabus and its `verified` flag set to true with a source.
#
# A wrong subject name is not cosmetic: it is what a student picks in
# onboarding and what the exam's combination rules are enforced against.
# ---------------------------------------------------------------------------

meta:
  drafted_on: 2026-09-23
  verified_against_official_lists: false
  verify_before: "Phase 4 content authoring"

# Waves come from master prompt v2 §9.5. A subject goes live only when it meets
# the verified-content threshold, not when it appears here.
waves:
  1: "Most SS1-SS3 students take these for WAEC and JAMB"
  2: "Remaining core and elective subjects"
  3: "Second-wave exams (BECE, NCEE, JUPEB, IJMB)"

subjects:

