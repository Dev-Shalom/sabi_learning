[project]
name = "sabi"
version = "0.1.0"
description = "Grounded WAEC SS3 Mathematics study assistant with a measured evaluation harness"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "numpy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
sabi = "sabi.cli:main"

[tool.setuptools.packages.find]
include = ["sabi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
