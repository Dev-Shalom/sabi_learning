# Runtime configuration. Changing this file takes effect on the next request --
# there is no deploy step and no process restart. The loader stats the file and
# reloads when mtime changes (sabi/config.py).
#
# Plan limits here are the SEED for the `plans` table. Once seeded, the table in
# the database is the source of truth so an admin can change a limit live; run
# `sabi plans sync` to push changes from this file into the table.

plans:
  free:
    label: "Free"
    daily_question_cap: 15
    # Questions a single IP can ask per day across all anonymous ids. Anonymous
    # ids are resettable by clearing site data, so the cap alone is trivially
    # evaded; this is the backstop. Set generously -- shared school wifi and
    # Nigerian mobile carrier CGNAT put many real students behind one address.
    daily_ip_cap: 90
    burst_per_minute: 6
    monthly_cost_ceiling_usd_per_user: 0.40
    # Photographs read per day. Separate from the question cap because
    # reading one is a model call whether or not a question follows, and a
    # student retaking a blurry picture has not asked three questions.
    daily_ocr_cap: 5
    daily_exam_cap: 1      # one timed mock a week on free; enforced daily

  # What signing up buys. Note what it is NOT: the daily count is not reset by
  # creating an account, because usage is keyed on the identity and signing up
  # keeps the same one. So this is a higher ceiling, not a fresh start -- which
  # is both the honest reward and the thing that stops "clear cookies, sign up,
  # fifteen more" from working.
  #
  # The IP cap is higher too, for a specific reason: `ip_usage_today` counts
  # every request from an address regardless of who sent it, so a student on
  # school wifi or behind carrier NAT can be capped by strangers. An account is
  # the signal that lets them out of that without opening the anonymous tier up.
  free_account:
    label: "Free account"
    daily_question_cap: 25
    daily_ip_cap: 240
    burst_per_minute: 8
    monthly_cost_ceiling_usd_per_user: 0.70
    daily_ocr_cap: 10
    daily_exam_cap: 3

# Which syllabuses exist. Retrieval is scoped to exactly one (board, subject)
# pair per question, and a partial index is built per pair, so this list is
# what decides both. Adding a subject here plus its corpus documents is the
# whole of adding a subject -- there is no code change.
#
# Only list a subject once it has real documents: an empty scope retrieves
# nothing and refuses everything, which looks like a bug rather than an
# absence.
syllabus:
  subjects:
    - Mathematics
    - Physics
    - Chemistry
  exam_boards:
    - WAEC

limiter:
  # Applies to every caller including internal testing and the eval harness.
  # The eval harness runs as a real user on the `internal` plan; it is metered.
  enforce_for_internal: true

budget:
  # Global monthly kill switch. Spend is summed from the requests table.
  monthly_ceiling_usd: 25.00
  # Below this fraction of the ceiling: normal service.
  # Between warn and ceiling: cheap model only, no escalation.
  warn_fraction: 0.75
  # At the ceiling: cache-only. A question with no cache hit gets an honest
  # "we are at capacity today" page, never a silently degraded answer.
  degrade_mode: "cache_only"

retrieval:
  top_k_lexical: 24
  top_k_vector: 24
  rrf_k: 60
  rerank_top_n: 8
  final_context_chunks: 4
  # Below this confidence the system refuses instead of answering.
  # Chosen by tools/sweep_thresholds.py over a 5x5 grid against the 100-item
  # golden set, under a selection rule fixed before the sweep ran. See
  # EVALUATION.md for the grid and the tradeoff that was rejected.
  refusal_threshold: 0.40
  # How strongly a question has to match a "Not on this syllabus" section
  # before the system refuses and cites that section as evidence.
  scope_exclusion_threshold: 0.42
  # Below this, escalate to the stronger model instead of refusing outright.
  escalation_threshold: 0.55

cache:
  enabled: true
  # Cosine similarity on the question embedding. Exam questions repeat across
  # students, so this is the main cost lever.
  similarity_threshold: 0.94
  ttl_days: 30

models:
  # Cheap model serves by default. Escalation is logged per request.
  default: "claude-haiku-4-5"
  escalation: "claude-sonnet-5"
  judge: "claude-sonnet-5"

answering:
  prompt_version: "v3"
  max_answer_tokens: 700
